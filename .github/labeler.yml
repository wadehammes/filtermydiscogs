javascript:
  - changed-files:
      - any-glob-to-any-file:
          - src/**/*
          - scripts/**/*
          - public/**/*
          - .tool-versions
          - docs/**/*
          - CLAUDE.md

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**/*
          - CLAUDE.md
          - AGENTS.md
          - README.md

configuration:
  - changed-files:
      - any-glob-to-any-file:
          - next.config.ts
          - next-env.d.ts
          - biome.json
          - jest.config.ts
          - tsconfig.json
          - vercel.json
          - mise.toml
          - .browserslistrc
          - stylelint.config.mjs
          - knip.json

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - .tool-versions
          - mise.toml
          - package.json
          - pnpm-lock.yaml
          - pnpm-workspace.yaml

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**/*
          - .github/labeler.yml
