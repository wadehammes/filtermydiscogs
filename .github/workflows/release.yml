name: create-release
on:
  push:
    tags:
      - "v*"
# Only this workflow should update `main` (see docs/handbook/platform.md → Branching and GitHub rulesets).
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Default checkout persists GITHUB_TOKEN on git HTTP auth; that overrides a PAT embedded in the remote URL and Reset Main still pushes as github-actions[bot] (no ruleset bypass).
          persist-credentials: false
      - name: Reset Main
        id: reset_main
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "$RELEASE_PUSH_TOKEN" ]; then
            echo "::error::Add repository secret RELEASE_PUSH_TOKEN (PAT with Contents read/write; owner on Production — main bypass). See docs/handbook/platform.md → Branching and GitHub rulesets."
            exit 1
          fi
          # Clear any persisted git HTTP auth before pointing origin at the PAT. checkout
          # writes this key to LOCAL config, so the global unset alone is not a backstop.
          git config --global --unset-all "http.https://github.com/.extraheader" || true
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git remote set-url origin "https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "${{ github.ref }}:main"
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@0440d0932f9a0dd1cc9ecd8412830761351323bd # v4.7.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
