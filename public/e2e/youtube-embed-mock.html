<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>E2E YouTube embed mock</title>
  </head>
  <body>
    <button
      type="button"
      id="e2eSimulateYoutubePause"
      aria-label="E2E simulate YouTube pause"
    >
      E2E pause
    </button>
    <script>
      const YOUTUBE_PLAYER_STATE_PLAYING = 1;
      const YOUTUBE_PLAYER_STATE_PAUSED = 2;
      const YOUTUBE_EMBED_ERROR_VIDEO_UNAVAILABLE = 100;

      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode") || "normal";
      const delayMs = Number(params.get("delayMs") || "800");

      const post = (payload) => {
        window.parent.postMessage(JSON.stringify(payload), "*");
      };

      let playbackStarted = false;
      let transportPaused = false;
      let playingIntervalId = null;

      const clearPlayingInterval = () => {
        if (playingIntervalId !== null) {
          window.clearInterval(playingIntervalId);
          playingIntervalId = null;
        }
      };

      const emitPlaying = () => {
        if (transportPaused) {
          return;
        }

        post({
          event: "infoDelivery",
          info: {
            playerState: YOUTUBE_PLAYER_STATE_PLAYING,
            currentTime: 1,
            duration: 212,
          },
        });
        post({ event: "onStateChange", info: YOUTUBE_PLAYER_STATE_PLAYING });
      };

      const emitPaused = () => {
        transportPaused = true;
        clearPlayingInterval();
        post({
          event: "infoDelivery",
          info: {
            playerState: YOUTUBE_PLAYER_STATE_PAUSED,
            currentTime: 1.2,
            duration: 212,
          },
        });
        post({ event: "onStateChange", info: YOUTUBE_PLAYER_STATE_PAUSED });
      };

      const emitError = () => {
        post({
          event: "onError",
          info: YOUTUBE_EMBED_ERROR_VIDEO_UNAVAILABLE,
        });
      };

      const startPlaybackSignals = () => {
        if (mode === "silent") {
          return;
        }

        if (mode === "error") {
          emitError();
          return;
        }

        transportPaused = false;

        if (playbackStarted) {
          emitPlaying();
          return;
        }

        playbackStarted = true;
        post({ event: "onReady" });

        const emitAfterDelay = () => {
          emitPlaying();
          clearPlayingInterval();
          playingIntervalId = window.setInterval(emitPlaying, 350);
        };

        window.setTimeout(emitAfterDelay, Math.max(0, delayMs));
      };

      document
        .getElementById("e2eSimulateYoutubePause")
        .addEventListener("click", () => {
          emitPaused();
        });

      window.addEventListener("message", (event) => {
        if (typeof event.data !== "string") {
          return;
        }

        let data;

        try {
          data = JSON.parse(event.data);
        } catch {
          return;
        }

        if (data.event === "listening") {
          startPlaybackSignals();
          return;
        }

        if (data.event !== "command") {
          return;
        }

        if (data.func === "pauseVideo") {
          emitPaused();
          return;
        }

        if (data.func === "playVideo") {
          startPlaybackSignals();
          return;
        }

        const syncCommands = [
          "loadVideoById",
          "getPlayerState",
          "getCurrentTime",
          "getDuration",
        ];

        if (syncCommands.includes(data.func)) {
          window.setTimeout(startPlaybackSignals, 10);
        }
      });

      if (mode === "normal" || mode === "delayed") {
        window.setTimeout(startPlaybackSignals, delayMs);
      }
    </script>
  </body>
</html>
