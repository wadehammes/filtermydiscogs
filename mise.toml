# Tool versions live in `.tool-versions` (mise + GitHub Actions both read it).

[env]
# Loads Discogs/Postgres/etc. for mise tasks and shells in this directory.
# Missing file is fine (new clones before `.env.local` exists).
_.file = { path = ".env.local", redact = true }

[tasks.bootstrap]
description = "Install JS deps and generate Prisma client (also runs via `mise bootstrap`)"
run = [
  "pnpm install",
  "pnpm db:generate",
]

[tasks.ci]
description = "Same gates as PR CI (unit job + Playwright smoke)"
run = [
  "pnpm tsc:ci",
  "pnpm lint:ci",
  "pnpm lint:css",
  "pnpm handbook:check",
  "pnpm test:ci",
  "pnpm knip:ci",
  "pnpm test:e2e:smoke:ci",
]

[tasks.ci-full]
description = "Unit gates plus full Playwright (all specs and viewports; matches push to staging)"
run = [
  "pnpm tsc:ci",
  "pnpm lint:ci",
  "pnpm lint:css",
  "pnpm handbook:check",
  "pnpm test:ci",
  "pnpm knip:ci",
  "pnpm test:e2e:ci",
]

[tasks.lint-all]
description = "Biome (changed vs staging), Stylelint fix, tsc:ci, Knip"
run = "pnpm lint:all"

[tasks.pr-prep]
description = "Pre-PR: lint:all, handbook sync vs staging, Fallow audit (changed files)"
run = [
  "pnpm lint:all",
  "pnpm handbook:check",
  "pnpm fallow:audit",
]
